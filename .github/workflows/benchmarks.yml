name: benchmarks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - boost_unordered_flat_map_fil-c

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:            
          - name: clang-x64
            compiler: fil++
            architecture: -m64
            sourcefile: running_insertion.cpp
            compileroptions: -std=c++2a -O3 -DNDEBUG -DHAVE_ABSEIL -DBOOST_ALL_NO_EMBEDDED_GDB_SCRIPTS
            outputfile: benchmark
            reportdir: clang-x64
            # os: ubuntu-20.04
            os: [self-hosted, linux, x64]
            install: clang
            command: sudo cgexec -g memory,cpu:shield sudo -u gha ./benchmark
          - name: clang-x64
            compiler: fil++
            architecture: -m64
            sourcefile: running_erase.cpp
            compileroptions: -std=c++2a -O3 -DNDEBUG -DHAVE_ABSEIL -DBOOST_ALL_NO_EMBEDDED_GDB_SCRIPTS
            outputfile: benchmark
            reportdir: clang-x64
            # os: ubuntu-20.04
            os: [self-hosted, linux, x64]
            install: clang
            command: sudo cgexec -g memory,cpu:shield sudo -u gha ./benchmark
          - name: clang-x64
            compiler: fil++
            architecture: -m64
            sourcefile: scattered_lookup.cpp
            compileroptions: -std=c++2a -O3 -DNDEBUG -DHAVE_ABSEIL -DBOOST_ALL_NO_EMBEDDED_GDB_SCRIPTS
            outputfile: benchmark
            reportdir: clang-x64
            # os: ubuntu-20.04
            os: [self-hosted, linux, x64]
            install: clang
            command: sudo cgexec -g memory,cpu:shield sudo -u gha ./benchmark
                       
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v3
      - name: Install packages
        if: matrix.install
        run: |
          # sudo -E apt-add-repository -y ppa:ubuntu-toolchain-r/test
          if uname -p | grep -q 'x86_64'; then sudo dpkg --add-architecture i386 ; fi
          sudo apt-get update
          sudo apt-get install -y ${{matrix.install}}
      - name: Install Fil-C
        if: startsWith(matrix.compiler, 'fil++')
        run: |
          set -xe
          sudo mkdir -p /opt/downloads
          sudo rm -rf /opt/fil
          cd /opt/downloads
          fil_c_version="0.674"
          sudo wget "https://github.com/pizlonator/fil-c/releases/download/v${fil_c_version}/optfil-${fil_c_version}-linux-x86_64.tar.xz"
          sudo tar -xvJf "optfil-${fil_c_version}-linux-x86_64.tar.xz"
          cd "optfil-${fil_c_version}-linux-x86_64"
          echo -e "YES\nYES" | sudo ./setup.sh
          echo "/opt/fil/bin" >> $GITHUB_PATH
      - name: Install Boost
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/boostorg/boost.git boost-root
          cd boost-root
          git checkout develop
          git submodule update --init
          ./bootstrap.sh
          ./b2 -d0 headers
      - name: Install Abseil
        run: |
          cd $GITHUB_WORKSPACE
          git clone -b lts_2022_06_23 https://github.com/abseil/abseil-cpp.git abseil-root
      - name: Compile
        run: |
          cd $GITHUB_WORKSPACE
          ${{matrix.compiler}} --version
          ${{matrix.compiler}} ${{matrix.sourcefile}} ${{matrix.architecture}} ${{matrix.compileroptions}} -o ${{matrix.outputfile}} -I$GITHUB_WORKSPACE/boost-root -I$GITHUB_WORKSPACE/abseil-root
      - name: Set reportfile name
        run: |
          echo "REPORT_FILE=${{matrix.reportdir}}/${{matrix.sourcefile}}.csv" >> $GITHUB_ENV
      - name: Run benchmarks
        run: |
          if [ -n "${{matrix.xcode_version}}" ]; then
              DEVELOPER_DIR=/Applications/Xcode-${{matrix.xcode_version}}.app/Contents/Developer
          fi        
          if [ -n "${{matrix.command}}" ]; then
            echo "running benchmarks and saving to "${REPORT_FILE}
            ${{matrix.command}} | tee ${REPORT_FILE}
          else
            echo "running benchmarks and saving to "${REPORT_FILE}
            ./${{matrix.outputfile}} | tee ${REPORT_FILE}
          fi
      - name: Push benchmark results to repo
        run: |
          git config --global user.name 'joaquintides'
          git config --global user.email 'joaquintides@users.noreply.github.com'
          git add ${REPORT_FILE}
          git stash -- ${REPORT_FILE}
          git pull
          git stash pop
          git add ${REPORT_FILE}
          git commit -m "updated benchmark results"
          git push
         
  final:
    needs: posix
    
    runs-on: ubuntu-latest
    container:
      image: python:2.7.18-buster
          
    steps:
      - uses: actions/checkout@v3
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
      - name: Fast-forward repo 
        run: |
          git pull
      - name: Run data feeding script
        run: |
          ./insert_data.sh
      - name: Push modified Excel files to repo
        run: |
          git config --global user.name 'joaquintides'
          git config --global user.email 'joaquintides@users.noreply.github.com'
          git commit -am "updated Excel files"
          git push          
